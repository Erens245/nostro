[package]
name = "nostro"
description = "Payment run controls and an on-chain ledger for a company's NEAR account"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true

# `cfg(near)` was introduced in `near-sdk` v5.27.0, and is expected cfg now
[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
