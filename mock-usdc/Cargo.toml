[package]
name = "mock-usdc"
description = "Test-only USDC stand-in with open minting. Worth nothing. Never deploy to mainnet."
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
